server:
  port: 8072

spring:
  application:
    name: gateway
  
  config:
    import:
    - "configserver:http://localhost:8071/"
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true

eureka:
  client:
   service-url:
    defaultZone: http://localhost:8070/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
   web:
    exposure:
     include: "*"

  endpoint:
   gateway:
    enabled: true
   info:
    enabled: true

  info:
    env:
     enabled: true

info:
  app:
   name: "gateway"
   description: "EazyBank gateway server application"
